services:
  caosach-prod-db:
    image: postgres:16-alpine
    container_name: caosach-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caosach_db
      POSTGRES_USER: caosach_user
      POSTGRES_PASSWORD: caosach_secure_password_2026
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - caosach_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caosach_user -d caosach_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caosach-prod-net

  caosach-prod-backend:
    image: node:24-alpine
    container_name: caosach-prod-backend
    restart: unless-stopped
    depends_on:
      caosach-prod-db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      PORT: 5005
      NODE_ENV: production
      CLIENT_ORIGIN: "https://caosach.soninfra.cloud,http://caosach.soninfra.cloud,http://localhost:5505"
      DB_HOST: 127.0.0.1
      DB_PORT: 5436
      DB_NAME: caosach_db
      DB_USER: caosach_user
      DB_PASSWORD: caosach_secure_password_2026
      JWT_SECRET: caosach_super_secret_jwt_key_2026_production
      BCRYPT_ROUNDS: 10
      ADMIN_DEFAULT_PASSWORD: admin123
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 5000
    network_mode: host
    command: sh -c "npm install --production --no-audit --no-fund && node scripts/migrate.js && node scripts/seed.js && node server.js"

  caosach-prod-frontend:
    image: nginx:1.30.1
    container_name: caosach-prod-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5505:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caosach-prod-net

volumes:
  caosach_prod_pgdata:

networks:
  caosach-prod-net:
    driver: bridge
