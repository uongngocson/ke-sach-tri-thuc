version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caosach-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: caosach_db
    ports:
      - "5432:5432"
    volumes:
      - caosach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caosach_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caosach_postgres_data:
    driver: local
