<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-glow" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="canopy-main" x1="30" y1="20" x2="98" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="canopy-top" x1="44" y1="16" x2="84" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="trunk-grad" x1="56" y1="65" x2="72" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#bg-glow)"/>
  <circle cx="64" cy="64" r="58" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Thân cây -->
  <path d="M58 72 C59 86, 56 100, 52 110 L76 110 C72 100, 69 86, 70 72 Z" fill="url(#trunk-grad)"/>

  <!-- Tán lá cây phân tầng -->
  <g filter="url(#shadow)">
    <!-- Tầng lá dưới -->
    <circle cx="44" cy="62" r="24" fill="#047857"/>
    <circle cx="84" cy="62" r="24" fill="#047857"/>
    <circle cx="64" cy="54" r="30" fill="url(#canopy-main)"/>
    
    <!-- Tầng lá trên sáng -->
    <circle cx="48" cy="46" r="20" fill="#10b981"/>
    <circle cx="80" cy="46" r="20" fill="#10b981"/>
    <circle cx="64" cy="38" r="22" fill="url(#canopy-top)"/>
    <circle cx="64" cy="30" r="14" fill="#a7f3d0"/>
  </g>

  <!-- Biểu tượng sách tri thức -->
  <rect x="52" y="84" width="24" height="16" rx="4" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="64" y="96" fill="#ffffff" font-size="10.5" font-weight="900" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Quicksand', sans-serif" letter-spacing="0.5">📖</text>

  <!-- Điểm nhấn hoa nhỏ và nến -->
  <circle cx="40" cy="44" r="3" fill="#fef08a"/>
  <circle cx="40" cy="44" r="1.5" fill="#f59e0b"/>
  <circle cx="88" cy="44" r="3" fill="#fecdd3"/>
  <circle cx="88" cy="44" r="1.5" fill="#e11d48"/>
  <circle cx="64" cy="22" r="2.5" fill="#fed7aa"/>
</svg>
