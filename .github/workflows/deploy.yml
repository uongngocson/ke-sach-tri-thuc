name: CI/CD Pipeline - Cáo Sách Multi-Environment

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caosach_ci_test_db
          POSTGRES_USER: test_runner_user
          POSTGRES_PASSWORD: test_runner_ephemeral_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Database Migrations & Seeds
        working-directory: ./server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: caosach_ci_test_db
          DB_USER: test_runner_user
          DB_PASSWORD: test_runner_ephemeral_pw
        run: |
          node scripts/migrate.js
          node scripts/seed.js

      - name: Run Comprehensive Test Suite
        working-directory: ./server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: caosach_ci_test_db
          DB_USER: test_runner_user
          DB_PASSWORD: test_runner_ephemeral_pw
          JWT_SECRET: test_runner_ephemeral_jwt_secret
        run: npm test

  deploy-staging:
    name: Deploy to Staging (https://stagcaosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Sync Code to Staging Directory
        run: |
          ssh -o StrictHostKeyChecking=no sonun@${{ secrets.SERVER_HOST }} "mkdir -p /home/sonun/deployments/caosach-staging"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --exclude '.git' --exclude 'node_modules' ./ sonun@${{ secrets.SERVER_HOST }}:/home/sonun/deployments/caosach-staging/

      - name: Deploy Staging Docker Containers
        run: |
          ssh -o StrictHostKeyChecking=no sonun@${{ secrets.SERVER_HOST }} "cd /home/sonun/deployments/caosach-staging && docker compose -f docker-compose.staging.yml up -d --build"

  deploy-prod:
    name: Deploy to Production (https://caosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Sync Code to Production Directory
        run: |
          ssh -o StrictHostKeyChecking=no sonun@${{ secrets.SERVER_HOST }} "mkdir -p /home/sonun/deployments/caosach-prod"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --exclude '.git' --exclude 'node_modules' ./ sonun@${{ secrets.SERVER_HOST }}:/home/sonun/deployments/caosach-prod/

      - name: Deploy Production Docker Containers
        run: |
          ssh -o StrictHostKeyChecking=no sonun@${{ secrets.SERVER_HOST }} "cd /home/sonun/deployments/caosach-prod && docker compose -f docker-compose.prod.yml up -d --build"
