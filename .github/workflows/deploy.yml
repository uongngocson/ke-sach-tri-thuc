name: CI/CD Pipeline - Cáo Sách Multi-Environment

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caosach_ci_test_db
          POSTGRES_USER: test_runner_user
          POSTGRES_PASSWORD: test_runner_ephemeral_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Database Migrations & Seeds
        working-directory: ./server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: caosach_ci_test_db
          DB_USER: test_runner_user
          DB_PASSWORD: test_runner_ephemeral_pw
        run: |
          node scripts/migrate.js
          node scripts/seed.js

      - name: Run Comprehensive Test Suite
        working-directory: ./server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: caosach_ci_test_db
          DB_USER: test_runner_user
          DB_PASSWORD: test_runner_ephemeral_pw
          JWT_SECRET: test_runner_ephemeral_jwt_secret
        run: npm test

  deploy-staging:
    name: Deploy to Staging (https://stagcaosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    steps:
      - name: Deploy to Staging Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/deployments/caosach-staging
            cd /home/${{ secrets.SERVER_USER }}/deployments/caosach-staging
            if [ -d .git ]; then
              git fetch origin
              git checkout development
              git reset --hard origin/development
            else
              git clone -b development https://github.com/uongngocson/ke-sach-tri-thuc.git .
            fi
            docker compose -f docker-compose.staging.yml up -d --build

  deploy-prod:
    name: Deploy to Production (https://caosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/deployments/caosach-prod
            cd /home/${{ secrets.SERVER_USER }}/deployments/caosach-prod
            if [ -d .git ]; then
              git fetch origin
              git checkout main
              git reset --hard origin/main
            else
              git clone -b main https://github.com/uongngocson/ke-sach-tri-thuc.git .
            fi
            docker compose -f docker-compose.prod.yml up -d --build
