name: CI/CD Pipeline - Cáo Sách Multi-Environment

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Test Suite
        working-directory: ./server
        run: npm test

  deploy-staging:
    name: Deploy to Staging (https://stagcaosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tailscale Auth & Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST || '100.101.27.107' }}
          username: ${{ secrets.SERVER_USER || 'sonun' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/sonun/deployments/caosach-staging
            cd /home/sonun/deployments/caosach-staging
            if [ -d .git ]; then
              git fetch origin
              git checkout development
              git reset --hard origin/development
            else
              git clone -b development https://github.com/uongngocson/ke-sach-tri-thuc.git .
            fi
            docker compose -f docker-compose.staging.yml up -d --build

  deploy-prod:
    name: Deploy to Production (https://caosach.soninfra.cloud)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tailscale Auth & Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST || '100.101.27.107' }}
          username: ${{ secrets.SERVER_USER || 'sonun' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/sonun/deployments/caosach-prod
            cd /home/sonun/deployments/caosach-prod
            if [ -d .git ]; then
              git fetch origin
              git checkout main
              git reset --hard origin/main
            else
              git clone -b main https://github.com/uongngocson/ke-sach-tri-thuc.git .
            fi
            docker compose -f docker-compose.prod.yml up -d --build
